version: '3.8'
services:
  orion:
    image: fiware/orion-ld
    ports:
      - "1026:1026"
    command: -dbhost mongodb -corsOrigin __ALL
    depends_on:
      - mongodb

  mongodb: #base de dades
    image: mongo:4.4
    volumes:
      - mongo_data:/data/db

  n8n: #automatització
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=azalea_upv
    volumes:
      - n8n_data:/home/node/.n8n
  
  mongo-express: #visualització de la base de dades
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password

  mysql: #històric de dades en SQL
    image: mariadb:11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=root_veinat
      - MARIADB_DATABASE=veinat
      - MARIADB_USER=veinat
      - MARIADB_PASSWORD=veinat_upv
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  adminer: #visualització de la base de dades SQL
    image: adminer
    restart: always
    ports:
      - "8082:8080"

  grafana: #dashboards de l'històric
    image: grafana/grafana-oss:11.3.0
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=azalea_upv
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - mysql

volumes:
  mongo_data:
  n8n_data:
  mysql_data:
  grafana_data:
